name: provider-health

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  run-health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run provider health check
        id: health
        env:
          PROVIDER_HEALTH_BASE_URL: ${{ vars.PROVIDER_HEALTH_URL }}
          PROVIDER_HEALTH_CONCURRENCY: ${{ vars.PROVIDER_HEALTH_CONCURRENCY }}
          PROVIDER_HEALTH_TIMEOUT_MS: ${{ vars.PROVIDER_HEALTH_TIMEOUT_MS }}
          PROVIDER_HEALTH_MATRIX: ${{ vars.PROVIDER_HEALTH_MATRIX }}
          PROVIDER_STATUS_FILE: /tmp/provider-status.json
        run: node scripts/provider-health-monitor.mjs --once

      - name: Debug provider health URL
        env:
          PROVIDER_HEALTH_URL: ${{ vars.PROVIDER_HEALTH_URL }}
        run: |
          echo "PROVIDER_HEALTH_URL=[${PROVIDER_HEALTH_URL}]"
          echo "length: ${#PROVIDER_HEALTH_URL}"
          printf '%s' "${PROVIDER_HEALTH_URL}" | od -c | head -20

      - name: Publish status to API
        if: always()
        env:
          PROVIDER_HEALTH_URL: ${{ vars.PROVIDER_HEALTH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TARGET="${PROVIDER_HEALTH_URL}/api/v2/providers/health/publish"
          echo "POST ${TARGET}"
          echo "CRON_SECRET length: ${#CRON_SECRET}"
          curl -fsS -v \
            -X POST \
            -H "x-vercel-cron: 1" \
            -H "x-vercel-cron-auth: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/provider-status.json \
            "${TARGET}" \
            -o /dev/null 2>&1
