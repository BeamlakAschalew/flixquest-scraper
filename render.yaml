services:
  - type: web
    name: flixquest-scraper
    env: node
    region: oregon
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TMDB_API_KEY
        sync: false
      - key: PORT
        value: 10000
    healthCheckPath: /
